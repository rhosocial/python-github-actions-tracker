# .github/workflows/images.yml
#
# Publishes the service image to the registries a deployment can reach:
# Aliyun (`registry.cn-shanghai.aliyuncs.com/vistart_public/citracker`, domestic
# China) and Docker Hub (`docker.io/vistart/citracker`, everywhere else). Each
# destination is independent -- a missing pair of secrets means that one is
# skipped, and the others still publish.
#
# **Manual only.** A push to main runs the tests (test.yml) and never builds an
# image: publishing a multi-arch image is a deliberate act, not a side effect of
# merging. Run it from the Actions tab or `gh workflow run images.yml --ref main`
# after the tests are green.
#
# Two tags per destination, with different jobs:
#   citracker:sha-<sha>  the commit that was built. Written by every build, never
#                        overwritten by another commit, safe to pin in a deploy.
#   citracker:latest     what main builds from. Moved only after the build
#                        finishes, and only from a run on main -- feature code
#                        must not become what production pulls. A dispatch of an
#                        older main commit is an explicit republish and moves it.
#
# The build uses the upstream python:3.15-slim base and the standard PyPI: a
# GitHub runner reaches both directly, so no mirror and no proxy is involved.
#
# Needs two pairs of repository secrets (Settings -> Secrets and variables ->
# Actions), either of which may be absent:
#   ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD      Aliyun
#   DOCKERHUB_REGISTRY_USERNAME / DOCKERHUB_REGISTRY_PASSWORD  Docker Hub
# Without a pair the destination is skipped and says so in the run summary. With
# neither, the job still builds -- a build failure is a real failure -- but
# publishes nothing.

name: Publish images

on:
  workflow_dispatch:

concurrency:
  # Per-commit: a newer dispatch of the same commit supersedes its own in-flight
  # build. Different commits are independent -- a manual rebuild of an old release
  # must not cancel, or be cancelled by, a build of the current tip.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ALIYUN_REGISTRY: registry.cn-shanghai.aliyuncs.com
  # A namespace within the Aliyun account; it is not the account itself.
  ALIYUN_NAMESPACE: vistart_public
  DOCKERHUB_REGISTRY: docker.io
  # The Docker Hub repository: `docker.io/vistart/citracker`. Same organisation
  # as the Aliyun namespace, so both destinations read as one product line.
  DOCKERHUB_NAMESPACE: vistart
  IMAGE: citracker

jobs:
  citracker:
    name: Service image
    runs-on: ubuntu-latest

    steps:
      # The siblings come from git inside the Dockerfile, so only this
      # repository needs checking out.
      - name: Check out this repository
        uses: actions/checkout@v4

      # The image is published worldwide; a proxy is a mainland-China runtime
      # choice. Keep it out of the build inputs rather than discovering it in a
      # published layer.
      #
      # grep, not rg: the runner image has no ripgrep, and a missing command
      # inside `if` reads as "no match" -- the guard ran and checked nothing on
      # every build until this was noticed in a log (2026-10-31).
      - name: Guard against proxy configuration in the image
        run: |
          if grep -nEi -- 'https?_proxy|all_proxy|no_proxy|pip_index_url|pip_trusted_host|mirrors\.aliyun\.com|127\.0.0.1:7897' \
            Dockerfile docker/entrypoint.sh .dockerignore docker-compose.yml docker-compose.bundled.yml; then
            echo "::error::proxy or mirror configuration must stay runtime-only"
            exit 1
          fi
          echo "no proxy or mirror configuration in the image inputs"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The commit and the CI run number are what make "which build is this?"
      # answerable from inside the container; the timestamp is stamped here
      # rather than inside the Dockerfile so it is the moment of publication.
      - name: Stamp this build
        id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Which destinations can be written to. Each pair is checked on its own so
      # a deployment that only needs Aliyun does not have to create a Docker Hub
      # account, and vice versa. The repository names come from `env`, above;
      # only the credentials differ per destination.
      - name: Check registry credentials
        id: check
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_REGISTRY_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}
        run: |
          if [ -n "$ALIYUN_USERNAME" ] && [ -n "$ALIYUN_PASSWORD" ]; then
            echo "aliyun=true" >> "$GITHUB_OUTPUT"
          else
            echo "aliyun=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped: Aliyun"
              echo
              echo "Missing secrets ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped: Docker Hub"
              echo
              echo "Missing secrets DOCKERHUB_REGISTRY_USERNAME / DOCKERHUB_REGISTRY_PASSWORD."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$ALIYUN_USERNAME$ALIYUN_PASSWORD" ] && [ -z "$DOCKERHUB_USERNAME$DOCKERHUB_PASSWORD" ]; then
            echo "::notice::no registry credentials at all; building without publishing"
          fi

      - name: Compose the tags
        id: tags
        env:
          ALIYUN: ${{ steps.check.outputs.aliyun }}
          DOCKERHUB: ${{ steps.check.outputs.dockerhub }}
        run: |
          list=""
          if [ "$ALIYUN" = "true" ]; then
            list="$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/$IMAGE:sha-$GITHUB_SHA"
          fi
          if [ "$DOCKERHUB" = "true" ]; then
            entry="$DOCKERHUB_REGISTRY/$DOCKERHUB_NAMESPACE/$IMAGE:sha-$GITHUB_SHA"
            list="${list:+$list$'\n'}$entry"
          fi
          if [ -z "$list" ]; then
            # Nothing to push to: one tag, so the build still names its output.
            list="$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/$IMAGE:sha-$GITHUB_SHA"
          fi
          # A multiline output needs the heredoc delimiter form: GitHub Actions
          # reads `name=value` one per line, so a bare second line would land in
          # the next step's environment as an unrelated variable and the second
          # registry would silently never be tagged.
          {
            echo "list<<TAGS"
            printf '%s\n' "$list"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Aliyun
        if: steps.check.outputs.aliyun == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Log in to Docker Hub
        if: steps.check.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}

      # Every build publishes its own commit tag and nothing else. `latest` is
      # moved afterwards by the next step, because which build finishes last is
      # not which commit is newest: two pushes close together build in parallel
      # under different concurrency groups, and on 2026-10-31 the older commit
      # finished second and silently replaced the newer image under `latest`.
      #
      # The build itself is one multi-arch build whichever destinations wrote to:
      # the manifest is built once and pushed to each registry in turn.
      - name: Build and publish the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.check.outputs.aliyun == 'true' || steps.check.outputs.dockerhub == 'true' }}
          # The Aliyun registry rejects OCI attestation manifests
          # (application/vnd.oci.empty.v1+json) with "unknown manifest class",
          # so provenance stays off for this target.
          provenance: false
          # The service reports these back from /readyz, /livez and ci_status.
          build-args: |
            GIT_REVISION=${{ github.sha }}
            GIT_BUILD_NUMBER=${{ github.run_number }}
            GIT_BUILT_AT=${{ steps.stamp.outputs.built_at }}
          tags: ${{ steps.tags.outputs.list }}

      # `latest` means "what main produces". Only a run on main may move it:
      # a dispatch on a feature branch or a tag publishes its commit tag only,
      # because feature code must not become what production pulls.
      #
      # There is no "has main moved past this commit?" check any more. Nothing
      # builds automatically, so a run of an older main commit is a deliberate
      # republish (a rollback is a legitimate reason), and it is honoured as is.
      - name: Move latest when building main
        if: steps.check.outputs.aliyun == 'true' || steps.check.outputs.dockerhub == 'true'
        env:
          REF: ${{ github.ref }}
          ALIYUN: ${{ steps.check.outputs.aliyun }}
          DOCKERHUB: ${{ steps.check.outputs.dockerhub }}
        run: |
          set -euo pipefail

          if [ "$REF" != "refs/heads/main" ]; then
            echo "::notice::$REF is not main; published sha-$GITHUB_SHA tags, latest untouched" |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          moved=""
          if [ "$ALIYUN" = "true" ]; then
            tag="$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/$IMAGE"
            docker buildx imagetools create --tag "$tag:latest" "$tag:sha-$GITHUB_SHA"
            moved="$tag:latest"
          fi
          if [ "$DOCKERHUB" = "true" ]; then
            tag="$DOCKERHUB_REGISTRY/$DOCKERHUB_NAMESPACE/$IMAGE"
            docker buildx imagetools create --tag "$tag:latest" "$tag:sha-$GITHUB_SHA"
            moved="$moved $tag:latest"
          fi
          echo "latest -> $GITHUB_SHA ($moved)" | tee -a "$GITHUB_STEP_SUMMARY"
