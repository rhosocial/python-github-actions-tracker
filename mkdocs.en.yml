# mkdocs.en.yml
#
# The English half of the documentation site. A second configuration builds the Chinese
# half (mkdocs.zh.yml); they differ in three lines -- docs_dir, site_dir and
# theme.language -- and share everything else by being written twice. A shared include
# would be one more mechanism to debug for a three-line saving.
#
# Navigation comes from the page's own SUMMARY.md (mkdocs-literate-nav), so the site has
# no second table of contents to drift from the one tests/app/test_documentation.py
# already guards.
site_name: GitHub Actions Tracker
site_description: Track GitHub Actions runs, jobs, steps and logs — over MCP, REST and a CLI.
site_url: https://rhosocial.github.io/python-github-actions-tracker/
repo_url: https://github.com/rhosocial/python-github-actions-tracker
repo_name: rhosocial/python-github-actions-tracker
copyright: >-
  Copyright &copy; 2026 rhosocial &middot;
  <a href="/python-github-actions-tracker/privacy/">Privacy</a> &middot;
  docs CC BY 4.0 &middot; code Apache-2.0

# SUMMARY.md is the repository's table of contents, not a site page.
exclude_docs: SUMMARY.md

docs_dir: docs/en_US
site_dir: site/en_US

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra:
  alternate:
    - name: English
      link: /python-github-actions-tracker/
      lang: en
    - name: 简体中文
      link: /python-github-actions-tracker/zh_CN/
      lang: zh

nav:
  - Home: README.md
  - Overview:
      - What it saves: value.md
      - Features: features.md
      - Architecture: architecture.md
  - Running it:
      - Installation: installation.md
      - Configuration: configuration.md
      - Deployment: deployment.md
      - Operations: operations.md
  - Using it:
      - The API: api.md
      - Coding agents over MCP: mcp-agents.md
      - The CLI: cli.md
      - Logs and windows: logs.md
  - Development:
      - Development: development.md
      - Testing: testing.md
  - Privacy: privacy.md

plugins:
  - search
  - htmlproofer:
      # External links are checked by hand: a timeout in CI is not a broken document,
      # and turning that into a red build teaches people to ignore the build.
      validate_external_urls: false
      raise_error_after_finish: true

extra_javascript:
  # Baidu Tongji is not a built-in provider; the file is duplicated in both docs
  # roots because each language builds from its own directory, and a test keeps
  # the two copies identical.
  - javascripts/baidu-tongji.js

extra:
  generator: false
  # Google Analytics 4 via Material's built-in integration. The property is the
  # organisation's; a per-site stream should replace it when there is one.
  analytics:
    provider: google
    property: G-VPM29QVEST

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      # Python-Markdown's default slugify drops every non-ASCII character, which
      # turns a Chinese heading into an empty anchor and breaks the three
      # cross-references the Chinese pages already had. uslugify keeps them.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences
