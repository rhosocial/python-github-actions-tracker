# mkdocs.zh.yml
#
# The Chinese half. Same shape as mkdocs.en.yml; the three differing lines are docs_dir,
# site_dir and theme.language, plus the localised UI strings Material carries per
# language. Keep the plugins and markdown_extensions identical to the English file --
# two builds that render differently are two sites, not one site in two languages.
site_name: citracker
site_description: GitHub Actions 运行、作业、步骤与日志的跟踪服务——通过 MCP、REST 与 CLI 访问。
site_url: https://rhosocial.github.io/python-github-ci-tracker/zh_CN/
repo_url: https://github.com/rhosocial/python-github-ci-tracker
repo_name: rhosocial/python-github-ci-tracker

# SUMMARY.md is the repository's table of contents, not a site page.
exclude_docs: SUMMARY.md

docs_dir: docs/zh_CN
site_dir: site/zh_CN

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra:
  alternate:
    - name: English
      link: /python-github-ci-tracker/
      lang: en
    - name: 简体中文
      link: /python-github-ci-tracker/zh_CN/
      lang: zh

nav:
  - 首页: README.md
  - 概览:
      - 它省下什么: value.md
      - 功能: features.md
      - 架构: architecture.md
  - 运行:
      - 安装: installation.md
      - 配置: configuration.md
      - 部署: deployment.md
      - 运维: operations.md
  - 使用:
      - 接口: api.md
      - 编码 Agent 接入 MCP: mcp-agents.md
      - 命令行: cli.md
      - 日志与窗口: logs.md
  - 开发:
      - 开发: development.md
      - 测试: testing.md

plugins:
  - search
  - htmlproofer:
      validate_external_urls: false
      raise_error_after_finish: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      # Python-Markdown's default slugify drops every non-ASCII character, which
      # turns a Chinese heading into an empty anchor and breaks the three
      # cross-references the Chinese pages already had. uslugify keeps them.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences
